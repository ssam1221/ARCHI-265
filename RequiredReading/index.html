<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Software Architecture — Required Reading / 필독 자료 정리</title>
<style>
  :root{ --accent:#1f5fa8; --accent2:#2c7a4b; --bg:#f7f8fa; --border:#e1e5ea; --muted:#cfe0f3; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;}
  body{display:flex;flex-direction:column;height:100vh;overflow:hidden;
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",Arial,sans-serif;
       background:var(--bg);color:#fff;}
  header{background:linear-gradient(135deg,#1f5fa8,#2c7a4b);padding:14px 22px;flex:0 0 auto;
         box-shadow:0 2px 6px rgba(0,0,0,.15);}
  .bar{display:flex;align-items:center;gap:18px;flex-wrap:wrap;max-width:1200px;margin:0 auto;}
  .brand{font-size:1.15rem;font-weight:700;letter-spacing:.01em;}
  .brand small{display:block;font-size:.72rem;font-weight:400;opacity:.9;}
  nav.weeks{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto;}
  nav.weeks button{border:1px solid rgba(255,255,255,.6);background:rgba(255,255,255,.08);color:#fff;
                   border-radius:22px;padding:7px 18px;font-size:.9rem;cursor:pointer;transition:.15s;}
  nav.weeks button:hover{background:rgba(255,255,255,.22);}
  nav.weeks button.active{background:#fff;color:var(--accent);font-weight:700;border-color:#fff;}
  .frame-wrap{flex:1 1 auto;position:relative;background:var(--bg);}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;}
  .hint{position:absolute;left:0;right:0;bottom:0;text-align:center;font-size:.72rem;color:#789;
        background:rgba(247,248,250,.9);padding:3px;pointer-events:none;}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand">Software Architecture — Required Reading
      <small>필독 자료 정리 · 영문/한국어 · 각 페이지 상단에서 언어 전환 가능</small>
    </div>
    <nav class="weeks" id="weeks"></nav>
  </div>
</header>

<div class="frame-wrap">
  <iframe id="viewer" title="Required reading viewer" src="RequiredReadingWeek1.html"></iframe>
</div>

<script>
  // Add future weeks here — the nav and routing update automatically.
  const WEEKS = [
    { id:'week0', label:'Week 0', file:'RequiredReadingWeek0.html' },
    { id:'week1', label:'Week 1', file:'RequiredReadingWeek1.html' },
  ];
  const DEFAULT = 'week1';
  const nav = document.getElementById('weeks');
  const viewer = document.getElementById('viewer');

  function select(id){
    const w = WEEKS.find(x=>x.id===id) || WEEKS.find(x=>x.id===DEFAULT);
    viewer.src = w.file;
    [...nav.children].forEach(b=>b.classList.toggle('active', b.dataset.id===w.id));
    if(location.hash.slice(1)!==w.id) history.replaceState(null,'','#'+w.id);
  }

  WEEKS.forEach(w=>{
    const b=document.createElement('button');
    b.textContent=w.label; b.dataset.id=w.id;
    b.onclick=()=>select(w.id);
    nav.appendChild(b);
  });

  window.addEventListener('hashchange',()=>select(location.hash.slice(1)));
  select(location.hash.slice(1) || DEFAULT);
</script>
</body>
</html>
